<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256">
  <title>DiscTool</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>

  <!-- Hard disk -->
  <rect x="44" y="76" width="152" height="94" rx="18" fill="url(#disk)"/>
  <circle cx="84" cy="123" r="20" fill="#94A3B8"/>
  <circle cx="84" cy="123" r="7" fill="#1D4ED8"/>
  <rect x="120" y="112" width="56" height="8" rx="4" fill="#94A3B8"/>
  <rect x="120" y="130" width="40" height="8" rx="4" fill="#CBD5E1"/>
  <circle cx="176" cy="156" r="6" fill="#22C55E"/>

  <!-- Magnifying glass -->
  <circle cx="170" cy="154" r="34" fill="#0F172A" opacity="0.15"/>
  <circle cx="166" cy="150" r="34" fill="none" stroke="#F59E0B"
          stroke-width="14"/>
  <line x1="191" y1="175" x2="220" y2="204" stroke="#F59E0B"
        stroke-width="18" stroke-linecap="round"/>
</svg>
